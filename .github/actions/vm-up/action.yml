name: VM up
description: Включает ВМ, ждёт k3s, направляет домен площадок на её IP и подключает kubectl к кластеру через SSH-туннель

inputs:
  ssh-private-key:
    description: SSH-ключ пользователя shugraph
    required: true
  cloudflare-api-token:
    description: Токен Cloudflare с правом DNS Edit на зону домена
    required: true
  cloudflare-zone-id:
    description: ID зоны домена в Cloudflare
    required: true
  domain:
    description: Домен prod, stage-площадки живут на его поддоменах
    required: true

outputs:
  ip:
    description: Публичный IP ВМ
    value: ${{ steps.up.outputs.ip }}

runs:
  using: composite
  steps:
    - name: Start VM and wait for k3s
      id: up
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
      run: |
        install -m 600 /dev/null "$RUNNER_TEMP/ssh-key"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh-key"
        SSH_KEY="$RUNNER_TEMP/ssh-key" infra/vm/vm.sh up

    - name: Point domain to VM
      shell: bash
      env:
        IP: ${{ steps.up.outputs.ip }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ZONE_ID: ${{ inputs.cloudflare-zone-id }}
        DOMAIN: ${{ inputs.domain }}
      run: infra/vm/dns.sh "$IP"

    - name: Connect kubectl to cluster
      shell: bash
      env:
        IP: ${{ steps.up.outputs.ip }}
      run: |
        ssh_opts=(-i "$RUNNER_TEMP/ssh-key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
        mkdir -p ~/.kube
        install -m 600 /dev/null ~/.kube/config
        ssh "${ssh_opts[@]}" "shugraph@$IP" 'sudo cat /etc/rancher/k3s/k3s.yaml' > ~/.kube/config
        ssh "${ssh_opts[@]}" -f -N -L 6443:127.0.0.1:6443 "shugraph@$IP"
        for _ in $(seq 10); do
          kubectl get --raw /readyz > /dev/null 2>&1 && exit 0
          sleep 2
        done
        echo "API кластера недоступен через туннель" >&2
        exit 1
