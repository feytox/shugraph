name: down

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: vm
  queue: max

jobs:
  down:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: vm
    env:
      VM_ID: ${{ vars.VM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yc # zizmor: ignore[self-repository]
        with:
          sa-key: ${{ secrets.YC_SA_KEY }}

      - name: Down
        run: infra/vm/vm.sh down
