name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Площадка
        type: choice
        options: [prod]
        default: prod
      graph-api:
        type: boolean
        default: true
      graph-admin-api:
        type: boolean
        default: true
      graph-frontapp:
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: cr.yandex/${{ vars.YC_REGISTRY_ID }}
  HELM_VERSION: v4.3.1
  HELMFILE_VERSION: 1.8.3

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      services: ${{ steps.plan.outputs.services }}
      selectors: ${{ steps.plan.outputs.selectors }}
      all-services: ${{ steps.plan.outputs.all-services }}
      checked: ${{ steps.checked.outputs.checked }}
    steps:
      - id: plan
        env:
          INPUTS: ${{ toJson(inputs) }}
        run: |
          all=$(jq -nc '[
            {name: "graph-api", context: "backend/graph-api", dockerfile: "backend/graph-api/Dockerfile"},
            {name: "graph-admin-api", context: "backend/graph-admin-api", dockerfile: "backend/graph-admin-api/Dockerfile"},
            {name: "graph-frontapp", context: "frontend", dockerfile: "frontend/graph-frontapp/Dockerfile"}
          ]')
          services=$(jq -c --argjson in "$INPUTS" 'map(select($in[.name] == true))' <<< "$all")
          if [[ $services == "[]" ]]; then
            echo "Не выбран ни один сервис" >&2
            exit 1
          fi
          {
            echo "services=$services"
            echo "selectors=$(jq -r 'map("-l name=" + .name) | join(" ")' <<< "$services")"
            echo "all-services=$([[ $services == "$all" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - &check-up-to-date
        name: Check branch is up to date with main
        if: inputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$MAIN...$GITHUB_SHA" --jq .behind_by)
          if (( behind > 0 )); then
            echo "::error::Ветка отстаёт от $MAIN на $behind коммитов: подлей $MAIN и запусти деплой заново"
            exit 1
          fi

      - id: checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[] | select(.name == "required-ok" or .name == "checks / required-ok") | select(.conclusion == "success") | .html_url')
          echo "checked=$([[ -n $passed ]] && echo true || echo false)" | tee -a "$GITHUB_OUTPUT"

  checks:
    needs: plan
    if: needs.plan.outputs.checked != 'true'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository]

  build:
    needs: [plan, checks]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: vm
      deployment: false
    strategy:
      matrix:
        service: ${{ fromJson(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_KEY }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy:
    needs: [plan, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      statuses: write
    environment: vm
    concurrency:
      group: vm
      queue: max
    timeout-minutes: 15
    env:
      VM_ID: ${{ vars.VM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yc # zizmor: ignore[self-repository]
        with:
          sa-key: ${{ secrets.YC_SA_KEY }}

      - *check-up-to-date

      - name: Install helm and helmfile
        run: |
          curl -sSL "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          curl -sSL "https://github.com/helmfile/helmfile/releases/download/v$HELMFILE_VERSION/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin helmfile
          helm version
          helmfile version

      - name: Up
        id: up
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ssh-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh-key"
          SSH_KEY="$RUNNER_TEMP/ssh-key" infra/vm/vm.sh up

      - name: Connect to cluster
        env:
          IP: ${{ steps.up.outputs.ip }}
        run: |
          ssh_opts=(-i "$RUNNER_TEMP/ssh-key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          ssh "${ssh_opts[@]}" "shugraph@$IP" 'sudo cat /etc/rancher/k3s/k3s.yaml' > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          ssh "${ssh_opts[@]}" -f -N -L 6443:127.0.0.1:6443 "shugraph@$IP"
          for _ in $(seq 10); do
            KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl get --raw /readyz > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "API кластера недоступен через туннель" >&2
          exit 1

      - name: Apply cluster config
        run: kubectl apply -f infra/k3s/

      - name: Deploy
        working-directory: infra/deploy
        env:
          IMAGE_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          SELECTORS: ${{ needs.plan.outputs.selectors }}
        run: |
          read -ra selectors <<< "$SELECTORS"
          helmfile -e "$ENVIRONMENT" -l name=postgres "${selectors[@]}" sync

      - name: Mark commit as deployed to prod
        if: inputs.environment == 'prod' && needs.plan.outputs.all-services == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=deploy/prod -f state=success \
            -f target_url="$RUN_URL" -f description="Задеплоено на prod" > /dev/null

      - name: Summary
        env:
          IP: ${{ steps.up.outputs.ip }}
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICES: ${{ needs.plan.outputs.services }}
        run: |
          {
            echo "Задеплоено на \`$ENVIRONMENT\`: $(jq -r 'map(.name) | join(", ")' <<< "$SERVICES"), коммит \`$GITHUB_SHA\`"
            echo
            echo "Адрес: http://$IP/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Schedule autodown
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run autodown.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
