name: checks

on:
  pull_request:
  workflow_call:
    inputs:
      graph-api:
        type: boolean
        default: false
      graph-admin-api:
        type: boolean
        default: false
      frontend:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  ZIZMOR_VERSION: 1.32.0
  NODE_VERSION: 22

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.pick.outputs.go }}
      frontend: ${{ steps.pick.outputs.frontend }}
      workflows: ${{ steps.pick.outputs.workflows }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            checks: &checks
              - .github/workflows/checks.yml
            graph-api:
              - *checks
              - backend/graph-api/**
            graph-admin-api:
              - *checks
              - backend/graph-admin-api/**
              - backend/graph-api/openapi.yaml
            frontend:
              - *checks
              - frontend/**
              - backend/graph-api/openapi.yaml
            workflows:
              - .github/**

      - id: pick
        env:
          PARTS: ${{ github.event_name == 'pull_request' && toJson(steps.filter.outputs) || toJson(inputs) }}
        run: |
          jq -r '
            map_values(tostring == "true") as $p
            | "go=" + ([["graph-api", "graph-admin-api"][] | select($p[.])] | tojson),
              "frontend=" + ($p.frontend | tostring),
              "workflows=" + ($p.workflows // false | tostring)
          ' <<< "$PARTS" | tee -a "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.go) }}
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod
          cache-dependency-path: backend/${{ matrix.service }}/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend/${{ matrix.service }}

      - if: ${{ !cancelled() }}
        run: make test

      - if: ${{ !cancelled() }}
        run: make integration-test

      - name: Check generated code
        if: ${{ !cancelled() }}
        run: |
          make gen
          go mod tidy
          if [[ -n $(git status --porcelain) ]]; then
            git status --short
            git diff
            echo "::error::Сгенерированный код устарел: запусти make gen и go mod tidy в backend/$MATRIX_SERVICE и закоммить изменения"
            exit 1
          fi
        env:
          MATRIX_SERVICE: ${{ matrix.service }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - if: ${{ !cancelled() }}
        run: pnpm lint

      - if: ${{ !cancelled() }}
        run: pnpm typecheck

      - if: ${{ !cancelled() }}
        run: pnpm test

      - name: Check generated code
        if: ${{ !cancelled() }}
        run: |
          pnpm gen:api
          if [[ -n $(git status --porcelain) ]]; then
            git status --short
            git diff
            echo "::error::Сгенерированные типы API устарели: запусти pnpm gen:api в frontend и закоммить изменения"
            exit 1
          fi

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false

  checks-ok:
    if: always()
    needs: [changes, go, frontend, workflows]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null

  govulncheck:
    needs: changes
    if: needs.changes.outputs.go != '[]'
    continue-on-error: true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.go) }}
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod
          cache-dependency-path: backend/${{ matrix.service }}/go.sum

      - run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  pnpm-audit:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - run: pnpm audit --prod
