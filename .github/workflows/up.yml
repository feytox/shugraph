name: up

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: vm
  queue: max

jobs:
  up:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    environment:
      name: vm
      deployment: false
    env:
      VM_ID: ${{ vars.VM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yc # zizmor: ignore[self-repository]
        with:
          sa-key: ${{ secrets.YC_SA_KEY }}
          folder-id: ${{ vars.YC_FOLDER_ID }}

      - uses: ./.github/actions/vm-up # zizmor: ignore[self-repository]
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          domain: ${{ vars.DOMAIN }}

      - name: Schedule autodown
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run autodown.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
