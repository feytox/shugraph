name: up

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: vm
  queue: max

jobs:
  up:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: vm
      deployment: false
    env:
      VM_ID: ${{ vars.VM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-yc # zizmor: ignore[self-repository]
        with:
          sa-key: ${{ secrets.YC_SA_KEY }}

      - name: Up
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ssh-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh-key"
          SSH_KEY="$RUNNER_TEMP/ssh-key" infra/vm/vm.sh up
