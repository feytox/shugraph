name: up

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: vm
  queue: max

jobs:
  up:
    runs-on: ubuntu-24.04
    environment: vm
    env:
      VM_ID: ${{ vars.VM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yc
        timeout-minutes: 3
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo /opt/yc/bin >> "$GITHUB_PATH"

      - name: Auth yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/yc-key.json"
          yc config set service-account-key "$RUNNER_TEMP/yc-key.json"
          yc iam create-token > /dev/null

      - name: Up
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ssh-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh-key"
          SSH_KEY="$RUNNER_TEMP/ssh-key" infra/vm/vm.sh up
