name: autodown

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: autodown
  cancel-in-progress: true

env:
  DELAY_MINUTES: 60

jobs:
  wait:
    runs-on: ubuntu-24.04
    steps:
      - run: sleep "$((DELAY_MINUTES * 60))"

  down:
    needs: wait
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/down.yml # zizmor: ignore[self-repository]
    secrets:
      YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
