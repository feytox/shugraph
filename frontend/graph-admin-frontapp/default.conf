server {
    listen 8080;
    server_name localhost;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ =404;
    }

    include /etc/nginx/admin-api-proxy/*.conf;
}
