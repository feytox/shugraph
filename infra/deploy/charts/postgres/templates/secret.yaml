{{- $existing := lookup "v1" "Secret" .Release.Namespace .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range .Values.passwords }}
  {{ . }}: {{ dig "data" . (randAlphaNum 32 | b64enc) $existing }}
  {{- end }}
