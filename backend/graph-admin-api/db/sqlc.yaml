version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: ../internal/repository/db
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_db_tags: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
