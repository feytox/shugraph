version: "2"
run:
  relative-path-mode: wd
  build-tags:
    - integration
linters:
  enable:
    - revive
    - staticcheck
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - wsl_v5
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: false
formatters:
  enable:
    - gofmt
    - goimports