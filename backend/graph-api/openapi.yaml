components:
  schemas:
    AllNoteOutputBody:
      additionalProperties: false
      properties:
        notes:
          items:
            $ref: "#/components/schemas/Note"
          type:
            - array
            - "null"
      required:
        - notes
      type: object
    CreateNoteInputBody:
      additionalProperties: false
      properties:
        text:
          description: Текст заметки
          minLength: 1
          type: string
      required:
        - text
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Note:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        text:
          type: string
      required:
        - id
        - text
        - created_at
      type: object
    StatusOutputBody:
      additionalProperties: false
      properties:
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
info:
  title: Graph API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/notes:
    get:
      operationId: get-all-notes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllNoteOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Retrieve all notes
      tags:
        - Notes
    post:
      operationId: create-note
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a new note
      tags:
        - Notes
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check that the process is alive
      tags:
        - Health
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Check that the service can handle requests
      tags:
        - Health
