components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        client_id:
          minLength: 1
          type: string
        id:
          minLength: 1
          type: string
      required:
        - id
        - client_id
      type: object
    AllNoteOutputBody:
      additionalProperties: false
      properties:
        notes:
          items:
            $ref: "#/components/schemas/Note"
          type:
            - array
            - "null"
      required:
        - notes
      type: object
    CreateNoteInputBody:
      additionalProperties: false
      properties:
        text:
          description: Текст заметки
          minLength: 1
          type: string
      required:
        - text
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Feature:
      additionalProperties: false
      properties:
        accounts_count:
          format: int64
          minimum: 0
          type: integer
        span_minutes:
          description: Elapsed whole minutes between first and last evidence events.
          format: int64
          minimum: 0
          type: integer
        total_amount:
          description: "Turnover in kopecks: sum of all evidence transfers, including repeated rounds."
          format: int64
          minimum: 0
          type: integer
      required:
        - accounts_count
        - span_minutes
        - total_amount
      type: object
    GetByIDOutputBody:
      additionalProperties: false
      properties:
        group:
          $ref: "#/components/schemas/Group"
      required:
        - group
      type: object
    GraphEdge:
      additionalProperties: false
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/OwnershipEdge"
            - $ref: "#/components/schemas/LoginEdge"
            - $ref: "#/components/schemas/TransferEdge"
      required:
        - data
      type: object
    GraphNode:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/GraphNodeData"
      required:
        - data
      type: object
    GraphNodeData:
      additionalProperties: false
      properties:
        entity_id:
          description: Original source identifier.
          minLength: 1
          type: string
        id:
          description: Type-prefixed ID, e.g. account:acc-1.
          minLength: 1
          type: string
        type:
          enum:
            - client
            - account
            - device
            - network_address
          type: string
      required:
        - id
        - type
        - entity_id
      type: object
    Group:
      additionalProperties: false
      properties:
        decided_at:
          description: Null while status is новая.
          format: date-time
          type:
            - string
            - "null"
        decision_comment:
          description: Empty until a decision is made.
          type: string
        events:
          items:
            oneOf:
              - $ref: "#/components/schemas/LoginEvent"
              - $ref: "#/components/schemas/TransferEvent"
          type: array
        features:
          $ref: "#/components/schemas/Feature"
        first_event_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        is_frozen:
          type: boolean
        last_event_at:
          format: date-time
          type: string
        members:
          items:
            $ref: "#/components/schemas/Account"
          type: array
        risk_parts:
          additionalProperties:
            format: int64
            type: integer
          description: Scheme-specific contributions; their sum equals risk_score. Used to explain the finding.
          type: object
        risk_score:
          format: int64
          maximum: 100
          minimum: 0
          type: integer
        scheme:
          enum:
            - ферма
            - адрес
            - цепочка
            - кольцо
          type: string
        status:
          enum:
            - новая
            - подтверждена
            - отклонена
          type: string
      required:
        - is_frozen
        - decision_comment
        - decided_at
        - members
        - events
        - id
        - scheme
        - status
        - risk_score
        - risk_parts
        - first_event_at
        - last_event_at
        - features
      type: object
    GroupGraph:
      additionalProperties: false
      properties:
        edges:
          items:
            $ref: "#/components/schemas/GraphEdge"
          type: array
        group_id:
          format: uuid
          type: string
        nodes:
          items:
            $ref: "#/components/schemas/GraphNode"
          type: array
      required:
        - group_id
        - nodes
        - edges
      type: object
    GroupItem:
      additionalProperties: false
      properties:
        features:
          $ref: "#/components/schemas/Feature"
        first_event_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        last_event_at:
          format: date-time
          type: string
        risk_parts:
          additionalProperties:
            format: int64
            type: integer
          description: Scheme-specific contributions; their sum equals risk_score. Used to explain the finding.
          type: object
        risk_score:
          format: int64
          maximum: 100
          minimum: 0
          type: integer
        scheme:
          enum:
            - ферма
            - адрес
            - цепочка
            - кольцо
          type: string
        status:
          enum:
            - новая
            - подтверждена
            - отклонена
          type: string
      required:
        - id
        - scheme
        - status
        - risk_score
        - risk_parts
        - first_event_at
        - last_event_at
        - features
      type: object
    GroupListOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/GroupItem"
          type: array
        next_cursor:
          description: Pass unchanged as cursor; null on the last page.
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    GroupSolutionInputBody:
      additionalProperties: false
      properties:
        approved:
          type: boolean
        decision_comment:
          minLength: 1
          pattern: \S
          type: string
      required:
        - approved
        - decision_comment
      type: object
    GroupSolutionOutputBody:
      additionalProperties: false
      properties:
        decided_at:
          format: date-time
          type: string
        decision_comment:
          minLength: 1
          pattern: \S
          type: string
        is_frozen:
          enum:
            - true
          type: boolean
        status:
          enum:
            - подтверждена
            - отклонена
          type: string
      required:
        - status
        - is_frozen
        - decision_comment
        - decided_at
      type: object
    LoginEdge:
      additionalProperties: false
      properties:
        event_id:
          minLength: 1
          type: string
        id:
          description: Unique type-prefixed edge ID. Login IDs additionally include device/address suffix.
          minLength: 1
          type: string
        occurred_at:
          format: date-time
          type: string
        source:
          minLength: 1
          type: string
        target:
          minLength: 1
          type: string
        type:
          enum:
            - login
          type: string
      required:
        - type
        - event_id
        - occurred_at
        - id
        - source
        - target
      type: object
    LoginEvent:
      additionalProperties: false
      properties:
        account_id:
          minLength: 1
          type: string
        address_id:
          description: Source IP/network address; retained as a source identifier.
          minLength: 1
          type: string
        client_id:
          minLength: 1
          type: string
        device_id:
          minLength: 1
          type: string
        event_id:
          minLength: 1
          type: string
        occurred_at:
          format: date-time
          type: string
        type:
          enum:
            - login
          type: string
      required:
        - event_id
        - type
        - occurred_at
        - account_id
        - client_id
        - device_id
        - address_id
      type: object
    LoginPayload:
      additionalProperties: false
      properties:
        account_id:
          minLength: 1
          type: string
        address_id:
          description: Source IP/network address; retained as a source identifier.
          minLength: 1
          type: string
        client_id:
          minLength: 1
          type: string
        device_id:
          minLength: 1
          type: string
        occurred_at:
          format: date-time
          type: string
      required:
        - occurred_at
        - account_id
        - client_id
        - device_id
        - address_id
      type: object
    Note:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        text:
          type: string
      required:
        - id
        - text
        - created_at
      type: object
    OwnershipEdge:
      additionalProperties: false
      properties:
        id:
          description: Unique type-prefixed edge ID. Login IDs additionally include device/address suffix.
          minLength: 1
          type: string
        source:
          minLength: 1
          type: string
        target:
          minLength: 1
          type: string
        type:
          enum:
            - ownership
          type: string
      required:
        - type
        - id
        - source
        - target
      type: object
    StatusOutputBody:
      additionalProperties: false
      properties:
        status:
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    TransferEdge:
      additionalProperties: false
      properties:
        amount:
          description: Amount in kopecks.
          format: int64
          minimum: 1
          type: integer
        event_id:
          minLength: 1
          type: string
        id:
          description: Unique type-prefixed edge ID. Login IDs additionally include device/address suffix.
          minLength: 1
          type: string
        occurred_at:
          format: date-time
          type: string
        source:
          minLength: 1
          type: string
        target:
          minLength: 1
          type: string
        type:
          enum:
            - transfer
          type: string
      required:
        - type
        - event_id
        - occurred_at
        - amount
        - id
        - source
        - target
      type: object
    TransferEvent:
      additionalProperties: false
      properties:
        amount:
          description: Amount in kopecks.
          format: int64
          minimum: 1
          type: integer
        event_id:
          minLength: 1
          type: string
        from_account_id:
          minLength: 1
          type: string
        from_client_id:
          minLength: 1
          type: string
        occurred_at:
          format: date-time
          type: string
        to_account_id:
          minLength: 1
          type: string
        to_client_id:
          minLength: 1
          type: string
        type:
          enum:
            - transfer
          type: string
      required:
        - event_id
        - type
        - occurred_at
        - from_account_id
        - from_client_id
        - to_account_id
        - to_client_id
        - amount
      type: object
    TransferPayload:
      additionalProperties: false
      properties:
        amount:
          description: Amount in kopecks.
          format: int64
          minimum: 1
          type: integer
        from_account_id:
          minLength: 1
          type: string
        from_client_id:
          minLength: 1
          type: string
        occurred_at:
          format: date-time
          type: string
        to_account_id:
          minLength: 1
          type: string
        to_client_id:
          minLength: 1
          type: string
      required:
        - occurred_at
        - from_account_id
        - from_client_id
        - to_account_id
        - to_client_id
        - amount
      type: object
info:
  title: Graph API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/events/logins/{event_id}:
    put:
      description: |-
        Event IDs are globally unique across both event types.
        New events return 201 with no body.
        An identical retry returns 204 without recomputing groups;
        an existing ID with different type or payload returns 409.
        Compare parsed values, not JSON formatting.
        Persistence/deduplication are implemented separately.
        Amounts are integer kopecks.
      operationId: login-event
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPayload"
        required: true
      responses:
        "201":
          description: Created
        "204":
          description: Identical event already accepted; no changes
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Implemented
      summary: Accept a login event
  /api/v1/events/transfers/{event_id}:
    put:
      description: |-
        Event IDs are globally unique across both event types.
        New events return 201 with no body.
        An identical retry returns 204 without recomputing groups;
        an existing ID with different type or payload returns 409.
        Compare parsed values, not JSON formatting.
        Persistence/deduplication are implemented separately.
        Amounts are integer kopecks.
      operationId: transfer-event
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferPayload"
        required: true
      responses:
        "201":
          description: Created
        "204":
          description: Identical event already accepted; no changes
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Implemented
      summary: Accept a transfer event
  /api/v1/groups:
    get:
      description: |-
        Ordered by first_event_at DESC, id DESC.
        cursor is an opaque continuation token bound to this order.
        Poll the first page to discover new groups. Invalid cursors return 400.
        An empty list has items: [] and next_cursor: null.
      operationId: list-groups
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 10
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque continuation token. Omit for the first page.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque continuation token. Omit for the first page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Implemented
      summary: List suspicious groups
  /api/v1/groups/{group_id}:
    get:
      operationId: get-group
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetByIDOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Implemented
      summary: Get a suspicious group
  /api/v1/groups/{group_id}/graph:
    get:
      description: |-
        Only the selected group's evidence subgraph.
        IDs are prefixed by entity/edge type. Parallel transfers remain separate edges.
        Each login produces two edges sharing event_id:
        account to device and account to network address.
        Ownership is client to account. Layout and presentation are client concerns.
      operationId: get-group-graph
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupGraph"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Implemented
      summary: Get a group's Cytoscape elements
  /api/v1/groups/{group_id}/solution:
    patch:
      description: |-
        approved=true confirms, false declines.
        A non-whitespace comment is required.
        Both decisions freeze the group and set decided_at.
        Only status новая may be decided, including a group frozen by expiry.
        Any subsequent decision returns 409; undo/history are outside this contract.
      operationId: resolve-group
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSolutionInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSolutionOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "501":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Implemented
      summary: Confirm or decline a new group
  /api/v1/notes:
    get:
      operationId: get-all-notes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllNoteOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Retrieve all notes
      tags:
        - Notes
    post:
      operationId: create-note
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a new note
      tags:
        - Notes
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check that the process is alive
      tags:
        - Health
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Check that the service can handle requests
      tags:
        - Health
