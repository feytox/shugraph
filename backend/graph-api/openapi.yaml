components:
  schemas:
    AllNoteOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AllNoteOutputBody.json
          format: uri
          readOnly: true
          type: string
        notes:
          items:
            $ref: "#/components/schemas/Note"
          type:
            - array
            - "null"
      required:
        - notes
      type: object
    CreateNoteInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateNoteInputBody.json
          format: uri
          readOnly: true
          type: string
        text:
          description: Текст заметки
          minLength: 1
          type: string
      required:
        - text
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GetByIDOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetByIDOutputBody.json
          format: uri
          readOnly: true
          type: string
      type: object
    GetGraphOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetGraphOutputBody.json
          format: uri
          readOnly: true
          type: string
      type: object
    GroupItem:
      additionalProperties: false
      properties:
        ID:
          type: string
        RiskScore:
          format: int64
          type: integer
        Scheme:
          type: string
      required:
        - ID
        - Scheme
        - RiskScore
      type: object
    GroupListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GroupListOutputBody.json
          format: uri
          readOnly: true
          type: string
        Items:
          items:
            $ref: "#/components/schemas/GroupItem"
          type:
            - array
            - "null"
      required:
        - Items
      type: object
    GroupSolutionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GroupSolutionInputBody.json
          format: uri
          readOnly: true
          type: string
        Approved:
          type:
            - boolean
            - "null"
        DecisionComment:
          type:
            - string
            - "null"
      required:
        - Approved
        - DecisionComment
      type: object
    GroupSolutionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GroupSolutionOutputBody.json
          format: uri
          readOnly: true
          type: string
        DecisionComment:
          type: string
        IsFrozen:
          type: boolean
        Status:
          type: string
      required:
        - Status
        - IsFrozen
        - DecisionComment
      type: object
    HealthCheckOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthCheckOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Operational status
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LoginInputBody.json
          format: uri
          readOnly: true
          type: string
        AccountID:
          type: string
        AddressID:
          type: string
        ClientID:
          type: string
        DeviceID:
          type: string
        OccurredAt:
          format: date-time
          type: string
      required:
        - OccurredAt
        - AccountID
        - ClientID
        - DeviceID
        - AddressID
      type: object
    Note:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Note.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        text:
          type: string
      required:
        - id
        - text
        - created_at
      type: object
    ReadyCheckOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReadyCheckOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Availability status
          examples:
            - ok
          type: string
      required:
        - status
      type: object
    TransferInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/TransferInputBody.json
          format: uri
          readOnly: true
          type: string
        Amount:
          format: int64
          type: integer
        FromAccountID:
          type: string
        FromClientID:
          type: string
        OccurredAt:
          format: date-time
          type: string
        ToAccountID:
          type: string
        ToClientID:
          type: string
      required:
        - OccurredAt
        - FromAccountID
        - FromClientID
        - ToAccountID
        - ToClientID
        - Amount
      type: object
info:
  title: Graph API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/events/logins/{event_id}:
    put:
      operationId: login-event
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "201":
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an login event
  /api/v1/events/transfers/{event_id}:
    put:
      operationId: transfer-event
      parameters:
        - in: path
          name: event_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInputBody"
        required: true
      responses:
        "201":
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an transfer event
  /api/v1/groups:
    get:
      operationId: list-groups
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 10
            format: int64
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            default: 0
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Returns list of groups
  /api/v1/groups/{group_id}:
    get:
      operationId: get-group
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetByIDOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Return a group
  /api/v1/groups/{group_id}/graph:
    get:
      operationId: get-group-graph
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetGraphOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Returns the vertices and edges of the group graph
  /api/v1/groups/{group_id}/solution:
    patch:
      operationId: resolve-group
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSolutionInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSolutionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Makes decisions for the group
  /api/v1/notes:
    get:
      operationId: get-all-notes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllNoteOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retrieve all notes
    post:
      operationId: create-note
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a new note
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Checks the application's availability
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyCheckOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Checks the application's readiness for operation
