version: "2"
linters:
  enable:
    - revive
    - staticcheck
    - gosec
    - errorlint
    - bodyclose
    - noctx
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: false
formatters:
  enable:
    - gofmt
    - goimports